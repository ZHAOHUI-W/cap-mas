[project]
name = "cap-mas"
version = "0.1.0"
description = "Contract-driven multi-agent Code-as-Policy runtime for robot manipulation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["capmas*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
